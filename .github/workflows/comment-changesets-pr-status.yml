name: Comment changesets PR status
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-comment:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: changesets/action/pr-comment@v2
        with:
          body: |
            ### Status comment (fixed body)

            This is the status comment body produced by the workflow.
